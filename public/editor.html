<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazil Zaan - Video Editor</title>
    <style>
        :root {
            --black: #050505;
            --gold: #D4AF37;
            --white: #F5F5F7;
            --grey: #121212;
            --card-bg: #1c1c1e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--black);
            color: var(--white);
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            overflow-x: hidden;
        }

        /* --- Header Navigation --- */
        header {
            height: 70px;
            padding: 0 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--white);
            letter-spacing: -0.02em;
        }

        .logo span {
            color: var(--gold);
        }

        .nav-links a {
            text-decoration: none;
            color: #888;
            font-size: 0.9rem;
            font-weight: 500;
            margin-left: 25px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        /* --- Apple-style Scroll Reveal --- */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Main Content --- */
        main {
            padding: 120px 10vw 80px 10vw;
            box-sizing: border-box;
        }

        .page-header {
            margin-bottom: 60px;
        }

        .page-header h1 {
            font-size: 3rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .page-header p {
            color: #888;
            font-size: 1.2rem;
            margin-top: 15px;
            max-width: 600px;
            line-height: 1.6;
        }

        .portfolio-category {
            margin-bottom: 80px;
        }

        .portfolio-category h2 {
            font-size: 1.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        /* Work Card */
        .work-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease;
        }

        .work-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .work-card-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #18181c 0%, #0d0d10 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .work-card:hover .work-card-media {
            transform: scale(1.05);
        }

        /* Play overlay graphic */
        .play-indicator {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .work-card:hover .play-indicator {
            background: var(--gold);
            border-color: var(--gold);
            transform: scale(1.1);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 14px solid var(--white);
            margin-left: 4px;
            transition: border-left-color 0.3s ease;
        }

        .work-card:hover .play-icon {
            border-left-color: var(--black);
        }

        .work-card-info {
            position: relative;
            z-index: 2;
            padding: 24px;
            background: linear-gradient(to top, rgba(5, 5, 5, 0.9) 0%, rgba(5, 5, 5, 0) 100%);
            box-sizing: border-box;
            width: 100%;
        }

        .work-card-info h3 {
            font-size: 1.2rem;
            margin: 0;
            font-weight: 600;
        }

        .work-card-info p {
            font-size: 0.85rem;
            color: #888;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Quick Roles Switcher Footer */
        .page-footer {
            margin-top: 100px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 40px;
            text-align: center;
        }

        .page-footer h4 {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .footer-link-btn {
            padding: 12px 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: #a1a1a6;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .footer-link-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
        }

        /* --- Video Portfolio Additions --- */
        .work-card-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 1;
            pointer-events: none;
        }

        .work-card:hover .work-card-video {
            opacity: 1;
        }

        .play-indicator,
        .work-card-info {
            z-index: 5;
        }

        /* --- Lightbox Modal Styles --- */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(5, 5, 5, 0.95);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox-content {
            width: 90%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lightbox-content video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 3rem;
            cursor: pointer;
            transition: color 0.3s ease;
            line-height: 1;
        }

        .lightbox-close:hover {
            color: var(--gold);
        }

        /* --- Responsive Styles --- */
        @media (max-width: 900px) {
            main {
                padding: 100px 6vw 60px 6vw;
            }

            .page-header h1 {
                font-size: 2.2rem;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 0 6vw;
            }

            .logo {
                font-size: 1.1rem;
            }

            .back-home {
                font-size: 0.8rem;
            }

            .footer-links {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .footer-link-btn {
                width: 100%;
                text-align: center;
                box-sizing: border-box;
            }

            .lightbox-close {
                top: 15px;
                right: 15px;
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header>
        <a href="index.html" class="logo">Fazil<span>Zaan.</span></a>
        <div class="nav-links">
            <a href="roles.html">All Roles</a>
            <a href="index.html">Home</a>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Page Title Header -->
        <div class="page-header reveal">
            <h1>Video Editor</h1>
            <p>Bringing fragments of footage together to form a seamless, engaging story. Specialized in narrative flow,
                dialogue pacing, dynamic sound designs, and stylized color grading.</p>
        </div>

        <!-- Video Editor Grid -->
        <section class="portfolio-category">
            <h2 class="reveal">Recent Cuts</h2>
            <div class="grid" data-projects-grid data-specialty="editor" data-category="Recent Cuts"></div>
        </section>

        <!-- Page Switcher Footer -->
        <footer class="page-footer reveal">
            <h4>Explore Other Roles</h4>
            <div class="footer-links">
                <a href="cinematographer.html" class="footer-link-btn">Cinematographer</a>
                <a href="director.html" class="footer-link-btn">Assistant Director</a>
            </div>
        </footer>
    </main>

    <!-- Video Lightbox Modal -->
    <div id="video-lightbox" class="lightbox-modal">
        <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
        <div class="lightbox-content">
            <video id="lightbox-player" controls playsinline></video>
        </div>
    </div>

        <script>
        document.addEventListener('DOMContentLoaded', () => {
            const reveals = document.querySelectorAll('.reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            reveals.forEach(reveal => observer.observe(reveal));
        });
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/projects-data.js"></script>
    <script src="js/portfolio-core.js"></script>
    <script src="js/portfolio-render.js"></script>
</body>

</html>
